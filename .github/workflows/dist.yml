name: PSManager Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Distribution version override (e.g. 1.4.0)'
        required: false
        default: ''

jobs:
  build-distribution:
    name: Package PSManager Distributions
    runs-on: windows-latest
    # Publishing a release needs a write-scoped token; the repository default is read-only.
    permissions:
      contents: write
    env:
      # Secrets are exposed to steps through env; they are not readable in `if` expressions.
      PSMGR_CERT_PFX_BASE64: ${{ secrets.PSMGR_CERT_PFX_BASE64 }}
      PSMGR_CERT_PASSWORD: ${{ secrets.PSMGR_CERT_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          $ref = "${{ github.ref_name }}"
          $v = if ($inputVer) {
            $inputVer.TrimStart('v')
          } elseif ($ref -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') {
            $Matches[1]
          } else {
            (Test-ModuleManifest ./PSManager.psd1).Version.ToString()
          }
          Write-Host "Packaging PSManager version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Restore Code Signing Certificate
        if: env.PSMGR_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:PSMGR_CERT_PFX_BASE64))
          "PSMGR_CERT_PATH=$certPath" >> $env:GITHUB_ENV
          Write-Host "Signing certificate restored."

      - name: Build Distributions and Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $dist = Join-Path $env:RUNNER_TEMP "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          # Splat a hashtable: an array splat would bind -Action positionally and fail ValidateSet.
          $buildArgs = @{ Action = 'all'; Destination = $dist; Version = $ver }
          if ($env:PSMGR_CERT_PATH) {
            $buildArgs['CertificatePath'] = $env:PSMGR_CERT_PATH
            $buildArgs['CertificatePassword'] = $env:PSMGR_CERT_PASSWORD
            Write-Host "Building signed artifacts."
          } else {
            Write-Host "No signing certificate configured; building unsigned artifacts."
          }
          ./build/build.ps1 @buildArgs
          # Extract standalone bundle binaries as the loose exe assets so they run anywhere without dependencies
          $bundleZip = Join-Path $dist "psmgr-$ver-windows-bundle.zip"
          Expand-Archive -LiteralPath $bundleZip -DestinationPath $dist -Force
          # The extraction replaced the loose launchers, so refresh the digests to match the shipped bytes.
          Import-Module (Join-Path $PWD "build/PSManager.Builder.psm1") -Force
          $null = New-PSManagerChecksumFile -Destination $dist
          Get-ChildItem $dist | ForEach-Object { Write-Host ("Packaged: " + $_.Name + " (" + $_.Length + " bytes)") }

      - name: Verify Signatures
        if: env.PSMGR_CERT_PATH != ''
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "dist"
          Import-Module (Join-Path $PWD "build/PSManager.Builder.psm1") -Force
          $expected = (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $env:PSMGR_CERT_PATH, $env:PSMGR_CERT_PASSWORD)).Thumbprint
          Write-Host "Expected signer thumbprint: $expected"
          # Test-PSManagerSignature calls WinVerifyTrust: it validates the signature digest over the
          # file bytes (a modified file reports a digest mismatch) and separately reports chain
          # trust, which is expected to be false for a self-signed root on a clean runner.
          $failed = @()
          foreach ($file in @(Get-ChildItem $dist -Filter "*.exe")) {
            $result = Test-PSManagerSignature -Path $file.FullName -ExpectedThumbprint $expected
            if (-not $result.Passed) { $failed += $file.Name }
            Write-Host ("{0}: signature={1} chainTrusted={2} signer={3} :: {4}" -f $file.Name, $result.SignatureValid, $result.ChainTrusted, $result.ThumbprintMatches, $result.Reason)
          }
          if ($failed.Count -gt 0) { throw ("Artifacts failed signature verification: " + ($failed -join ", ")) }

      - name: Upload Artifacts (Action Run)
        uses: actions/upload-artifact@v7
        with:
          name: psmgr-${{ steps.ver.outputs.version }}-distribution
          path: ${{ runner.temp }}/dist/*

      - name: Publish GitHub Release (Tagged Runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
